[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frontier-agent"
version = "0.1.0"
description = "Local-first AI orchestration platform with human-in-the-loop escalation"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3",
    "langchain-ollama>=0.3",
    "langchain-anthropic>=0.3",
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "rich>=13",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "ddgs>=0.3",
    "trafilatura>=1.9",
]

[project.scripts]
frontier = "frontier_agent.cli:app"
frontier-mcp = "frontier_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["frontier_agent"]
