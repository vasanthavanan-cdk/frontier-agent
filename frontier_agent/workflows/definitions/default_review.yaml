version: "1.0"
name: "default_review"
description: "Review workflow: plan → review. Best for code review, PR review, architecture review."

models:
  planner: "qwen2.5-coder:7b"
  coder: "qwen2.5-coder:7b"
  reviewer: "qwen2.5-coder:7b"
  documenter: "qwen2.5-coder:7b"
  fallback_premium: "claude-sonnet-4-5"

confidence_thresholds:
  planner: 0.65
  coder: 0.65
  reviewer: 0.85
  documenter: 0.65
  default: 0.70

escalation:
  require_human_approval: true
  max_local_retries: 3

research:
  enabled: false       # reviews work from code passed in — no web lookup needed
  max_sources: 3

steps:
  - id: plan
    agent: planner
    input_template: "{{user_task}}"
    output_key: plan

  - id: review
    agent: reviewer
    input_template: "{{plan}}"
    depends_on: [plan]
    output_key: review

routing_rules:
  - condition: "confidence['reviewer'] < thresholds['reviewer'] and retries >= 3"
    action: escalate
